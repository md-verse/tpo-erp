<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPO Student Portal</title>
    <link rel="stylesheet" href="../admin/css/layout.css"> <!-- Reusing global layout -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Login View -->
    <div id="loginView" class="login-container" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="form-card" style="width: 350px;">
            <h2 class="text-center">Student Login</h2>
            <form id="loginForm">
                <div class="form-group mb-3">
                    <label>GR Number</label>
                    <input type="text" id="grNo" class="form-control" required>
                </div>
                <div class="form-group mb-3">
                    <label>Passkey</label>
                    <input type="password" id="passkey" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard View (Hidden by default) -->
    <div id="dashboardView" style="display: none;">
        <header class="top-nav">
            <div class="logo-area"><h2>TPO Student</h2></div>
            <div class="user-area">
                <span id="studentNameDisplay"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>
        <main class="main-content">
            <div class="kpi-grid mb-4">
                <div class="kpi-card"><h3>Profile</h3><h2 id="completionScore">--%</h2></div>
            </div>
            <h2>Eligible Drives</h2>
            <div id="drivesContainer" class="drives-grid"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
