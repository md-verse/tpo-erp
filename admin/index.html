<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPO ERP - Admin Portal</title>
    <!-- Note the ../shared/ paths -->
    <link rel="stylesheet" href="../shared/css/layout.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo-area">
            <button id="sidebarToggle" class="icon-btn"><i class="fas fa-bars"></i></button>
            <span class="logo-text"><i class="fas fa-graduation-cap"></i> TPO ERP</span>
        </div>
        <nav class="main-modules">
            <button class="module-btn active" data-module="student">Student</button>
            <button class="module-btn" data-module="employer">Employer</button>
            <button class="module-btn" data-module="training">Training</button>
            <button class="module-btn" data-module="admin">Admin</button>
            <button class="module-btn" data-module="reports">Reports</button>
        </nav>
        <div class="user-area">
            <select id="academicYear" class="form-control" style="width: auto;">
                <option value="2026-2027" selected>AY 2026-27</option>
            </select>
            <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <ul class="sidebar-menu" id="sidebarMenu"></ul>
        </aside>
        <main class="main-content">
            <div id="contentArea">
                <h2>Welcome to TPO Operations</h2>
                <p>Select a module to begin.</p>
            </div>
        </main>
    </div>

   <!-- 1. Shared API -->
    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/auth.js"></script>
    <!-- 2. Admin UI Controller -->
    <script src="js/core/ui.js"></script>
    
    <!-- 3. ALL MODULE SCRIPTS MUST BE INCLUDED HERE -->
    <script src="js/modules/students.js"></script>
    <script src="js/modules/drives.js"></script>
    <script src="js/modules/applications.js"></script>
    <script src="js/modules/training.js"></script>
    <script src="js/modules/reports.js"></script>
    <script src="js/modules/settings.js"></script>
    
    <!-- Chart.js for Reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
