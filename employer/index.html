<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employer ATS Portal</title>
    <link rel="stylesheet" href="../admin/css/layout.css">
    <link rel="stylesheet" href="../admin/css/components.css">
</head>
<body style="background: #f4f6fa; padding: 2rem;">
    
    <div id="employerLogin" class="form-card" style="max-width: 400px; margin: auto;">
        <h2>Employer Portal</h2>
        <p class="text-muted">Access your applicant tracking dashboard.</p>
        <div class="form-group mb-3">
            <label>Drive ID</label>
            <input type="text" id="driveId" class="form-control">
        </div>
        <div class="form-group mb-3">
            <label>Company Secret Key</label>
            <input type="password" id="companySecret" class="form-control">
        </div>
        <button class="btn btn-primary w-100" onclick="employerLogin()">Access ATS</button>
    </div>

    <div id="employerDashboard" style="display: none;">
        <h2>Applicant Tracking System</h2>
        <button class="btn btn-outline mb-3">Export All CVs (.zip)</button>
        <div class="table-responsive">
            <table class="tpo-table">
                <thead><tr><th>Applicant Name</th><th>Branch</th><th>CGPA</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="applicantTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/employer.js"></script>
</body>
</html>
