<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer ATS Portal</title>
    <link rel="stylesheet" href="../shared/css/layout.css">
    <link rel="stylesheet" href="../shared/css/components.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo-area"><span class="logo-text">Employer ATS</span></div>
        <div class="user-area">
            <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="app-container">
        <main class="main-content" style="width: 100%;">
            <h2>Applicant Tracking System</h2>
            <button class="btn btn-outline mb-3">Export All CVs (.zip)</button>
            <div class="table-responsive">
                <table class="tpo-table">
                    <thead>
                        <tr><th>Applicant Name</th><th>Branch</th><th>CGPA</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="applicantTableBody">
                        <tr><td colspan="5">Loading applicants...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="js/employer.js"></script>
    <script>
        // Redirect to login if token is missing
        if(!localStorage.getItem('activeDriveId')) window.location.href = '../index.html';
        else initEmployerDashboard();
    </script>
</body>
</html>
