<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPO ERP - Secure Login</title>
    <!-- Link to the shared global CSS -->
    <link rel="stylesheet" href="shared/css/components.css">
    <link rel="stylesheet" href="shared/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-bg">

    <div class="login-wrapper">
        <div class="login-brand">
            <i class="fas fa-graduation-cap"></i>
            <h1>TPO ERP</h1>
            <p>Placement & Training Operations</p>
        </div>

        <div class="login-card">
            <!-- Universal Tab Selector -->
            <div class="login-tabs">
                <button class="tab-btn active" data-target="studentForm">Student</button>
                <button class="tab-btn" data-target="employerForm">Employer</button>
                <button class="tab-btn" data-target="adminForm">Admin</button>
            </div>

            <div class="form-container">
                <!-- 1. Student Form -->
                <form id="studentForm" class="auth-form active">
                    <h3>Student Portal</h3>
                    <div class="form-group mb-3">
                        <label>GR Number</label>
                        <div class="input-icon">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="stuGr" class="form-control" placeholder="e.g. 210145" required>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label>Passkey</label>
                        <div class="input-icon">
                            <i class="fas fa-key"></i>
                            <input type="password" id="stuPass" class="form-control" placeholder="Enter your passkey" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Access Dashboard</button>
                </form>

                <!-- 2. Employer Form (Hidden initially) -->
                <form id="employerForm" class="auth-form">
                    <h3>Applicant Tracking System</h3>
                    <div class="form-group mb-3">
                        <label>Drive ID</label>
                        <div class="input-icon">
                            <i class="fas fa-building"></i>
                            <input type="text" id="empDrive" class="form-control" placeholder="e.g. DRV123456" required>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label>Company Secret</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="empSecret" class="form-control" placeholder="Provided by TPO" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Access ATS</button>
                </form>

                <!-- 3. Admin Form (Hidden initially) -->
                <form id="adminForm" class="auth-form">
                    <h3>TPO Staff Portal</h3>
                    <div class="form-group mb-3">
                        <label>Staff ID</label>
                        <div class="input-icon">
                            <i class="fas fa-user-tie"></i>
                            <input type="text" id="adminId" class="form-control" placeholder="e.g. TPO_01" required>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label>Admin Password</label>
                        <div class="input-icon">
                            <i class="fas fa-shield-alt"></i>
                            <input type="password" id="adminPass" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enter System</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Unified Shared Scripts -->
    <script src="shared/js/api.js"></script>
    <script src="shared/js/auth.js"></script>
</body>
</html>
